<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听力音色对比 · Edge vs 腾讯</title>
<style>
  :root {
    --bg: #f4f6fa; --surface: #fff; --text: #202b36; --muted: #667487;
    --border: #dfe5ee; --primary: #2f6fed; --primary-soft: #e9f0ff;
    --tencent: #0052d9; --tencent-soft: #e3edff;
  }
  [data-theme="dark"] {
    --bg: #0f141b; --surface: #161d27; --text: #e6ecf5; --muted: #9aa8bd;
    --border: #2a3646; --primary: #5b8bf5; --primary-soft: #1c2a47;
    --tencent: #6f9bf8; --tencent-soft: #16233f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 32px 16px 64px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  .sub { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 20px; margin-top: 16px;
  }
  .q-title { font-weight: 700; }
  .q-stem { color: var(--muted); font-size: 0.9rem; margin: 6px 0 12px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  button.play {
    border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700;
    cursor: pointer; font-size: 0.92rem;
  }
  .edge button.play { background: var(--primary); color: #fff; }
  .tencent button.play { background: var(--tencent); color: #fff; }
  button.play:disabled { opacity: 0.6; cursor: default; }
  .tag { font-size: 0.8rem; color: var(--muted); }
  .edge .tag b { color: var(--primary); }
  .tencent .tag b { color: var(--tencent); }
  .hint { font-size: 0.84rem; color: var(--muted); margin-top: 8px; }
  footer { color: var(--muted); font-size: 0.82rem; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 听力音色 A/B 对比</h1>
  <p class="sub">
    同一道题、同一句台词，两套神经网络音色各播一遍。A 是现役 Edge 播音级（Guy 男 + Aria 女），
    B 是腾讯大模型英文音色（WeJames 男 + WeWinny 女）。听完挑您更喜欢的那版，回对话里告诉我“A”或“B”即可。
  </p>
  <div id="questions"></div>
  <footer>SprintBook 临时对比页（不进入应用路由）</footer>
</div>

<script>
// 与 manifest 同源的文件名（生成脚本产物），只取前 5 题做对比
const DATA = [
  { id: "en-listen-001", stem: "What will the weather be like this afternoon?",
    files: [["en-listen-001-01-m.mp3","m"],["en-listen-001-02-f.mp3","f"]] },
  { id: "en-listen-002", stem: "Where is the city library?",
    files: [["en-listen-002-01-f.mp3","f"],["en-listen-002-02-m.mp3","m"]] },
  { id: "en-listen-004", stem: "When does the train leave?",
    files: [["en-listen-004-01-f.mp3","f"],["en-listen-004-02-m.mp3","m"]] },
  { id: "en-listen-005", stem: "What will the woman drink at last?",
    files: [["en-listen-005-01-m.mp3","m"],["en-listen-005-02-f.mp3","f"]] },
  { id: "en-listen-007", stem: "How much will the man pay for two T-shirts?",
    files: [["en-listen-007-01-m.mp3","m"],["en-listen-007-02-f.mp3","f"]] },
];

const BASE = location.pathname.replace(/voice-compare\.html.*$/, "");
const current = { token: 0 };

async function playSet(dir, files, btn) {
  const token = ++current.token;
  const old = btn.textContent;
  btn.textContent = "正在播放…"; btn.disabled = true;
  for (let i = 0; i < files.length; i++) {
    if (token !== current.token) break;
    await new Promise((resolve) => {
      const a = new Audio(`${BASE}audio/${dir}/${files[i][0]}`);
      a.onended = resolve; a.onerror = resolve;
      a.play().catch(resolve);
    });
    if (i < files.length - 1 && token === current.token) {
      await new Promise((r) => setTimeout(r, 480));
    }
  }
  if (token === current.token) { btn.textContent = old; btn.disabled = false; }
}

const container = document.getElementById("questions");
DATA.forEach((q, index) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-title">第 ${index + 1} 题 · ${q.id}</div>
    <div class="q-stem">${q.stem}</div>
    <div class="row edge">
      <button class="play">▶ A · Edge（Guy + Aria）</button>
      <span class="tag">现役版本</span>
    </div>
    <div class="row tencent">
      <button class="play">▶ B · 腾讯（WeJames + WeWinny）</button>
      <span class="tag">大模型英文音色</span>
    </div>
    <div class="hint">先点 A 再点 B，交替听两三遍再下结论。</div>
  `;
  const [aBtn, bBtn] = card.querySelectorAll("button.play");
  aBtn.onclick = () => playSet("listening", q.files, aBtn);
  bBtn.onclick = () => playSet("listening-tencent", q.files, bBtn);
  container.appendChild(card);
});

// 跟随主应用的深色偏好
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = dark ? "dark" : "light";
</script>
</body>
</html>
